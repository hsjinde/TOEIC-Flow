name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          # 要對齊產生 lockfile 的本機版本；pnpm 9 也不認得 pnpm-workspace.yaml
          # 裡的 allowBuilds 欄位。
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        # 排除 *.real.test.ts：它們讀本機的 Obsidian vault，runner 上沒有那份筆記。
        run: pnpm test
        env:
          SKIP_REAL_TESTS: '1'

      # 刻意不跑 build:content。題庫 JSON 是 build 時從 Obsidian 筆記產生後 commit
      # 進版控的（見 CLAUDE.md），runner 上沒有 vault 可讀。筆記更新時要在本機重跑
      # build:content 並把 content/*.json 一起提交。
      - name: Build site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=toeic
